<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfa" />
    <meta
      name="description"
      content="Jot is a multiplayer Markdown workspace for people and agents."
    />
    <title>Jot</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("jot-theme");
          const theme =
            stored === "light" || stored === "dark"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === "dark" ? "#151816" : "#fbfbfa";
        } catch {
          // Theme initialization is best effort; the stylesheet has a system fallback.
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/" data-link aria-label="Jot home">JOT<span>/</span></a>
      <div class="masthead__right">
        <div class="participants" data-participants aria-label="Connected participants"></div>
        <div class="api-state" role="status" aria-live="polite">
          <span class="api-state__light" aria-hidden="true"></span>
          <span data-api-status>Starting Effect runtime…</span>
        </div>
        <button class="icon-button" type="button" data-theme-toggle aria-label="Change color theme">
          ◐
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div class="toast-region" data-toasts role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
