<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eee9de" />
    <meta
      name="description"
      content="Jot is a multiplayer Markdown workspace for people and agents."
    />
    <title>Jot</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="/" data-link aria-label="Jot home">JOT<span>/</span></a>
      <div class="masthead__right">
        <div class="participants" data-participants aria-label="Connected participants"></div>
        <div class="api-state" role="status" aria-live="polite">
          <span class="api-state__light" aria-hidden="true"></span>
          <span data-api-status>Starting Effect runtime…</span>
        </div>
        <button class="icon-button" type="button" data-theme aria-label="Change color theme">
          ◐
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div class="toast-region" data-toasts role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
