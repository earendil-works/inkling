name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      # Elanor installs from pkg.earendil.com, which trades the job's OIDC token for an install token.
      - name: Log in to pkg.earendil.com
        run: |
          oidc=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pkg.earendil.com" | jq -r .value)
          token=$(curl -sSf -X POST -H "Authorization: Bearer $oidc" \
            https://pkg.earendil.com/-/v1/login/github-actions | jq -r .token)
          echo "::add-mask::$token"
          npm config set //pkg.earendil.com/:_authToken "$token"
      - run: pnpm install --frozen-lockfile
      - run: make check
      - name: Check the standalone Cloudflare template
        run: |
          directory="$(mktemp -d)"
          cp -R templates/cloudflare/. "$directory"
          pnpm --dir "$directory" install --frozen-lockfile --ignore-workspace
          pnpm --dir "$directory" check
      - run: pnpm release:pack
